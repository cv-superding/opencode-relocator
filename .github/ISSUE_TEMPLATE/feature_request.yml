name: 功能建议
description: 提一个新功能或改进想法
title: "[feat] "
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 现在遇到的麻烦
      description: 先说想解决的问题，比直接说想加什么功能更容易讨论
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 如果有具体的界面草图或流程图，也可以贴进来
      render: text
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 大致范围
      options:
        - 只改界面
        - 改迁移流程
        - 支持另一个应用
        - 其它
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它方案
      render: text
    validations:
      required: false
